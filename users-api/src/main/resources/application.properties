spring.application.name=users-api

# Base de datos en memoria (H2)
spring.datasource.url=jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# El esquema lo crea el script SQL; Hibernate solo verifica que coincida con las entidades
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Validaciones configurables (expresiones regulares)
app.validation.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}$
app.validation.password-regex=^(?=.*[A-Za-z])(?=.*[0-9]).{6,}$

# JWT: en produccion sobreescribir con la variable de entorno JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-de-minimo-32-caracteres}
app.jwt.expiration-minutes=60
